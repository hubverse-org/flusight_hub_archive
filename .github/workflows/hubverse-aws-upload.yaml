name: Upload hub data to a hubverse-hosted AWS S3 bucket

on:
  push:
    branches:
      - main

permissions:
  contents: read
  # Required to request the hub's AWS role via OpenID Connect.
  id-token: write

jobs:
  upload:
    # A fork has no AWS role.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hubverse-org/hubverse-actions/s3-bucket-upload@v2
        # Whether anything is uploaded, and to which bucket, comes from the hub's
        # admin config. The account and region are hubverse's and need no change.
        with:
          aws_account: "767397675902"
          aws_region: us-east-1
